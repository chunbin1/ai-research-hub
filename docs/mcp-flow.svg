<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
<title>研报站 MCP 功能流程</title>
<desc>登录用户在阅读页复制提问文案,粘到 Claude、Codex 或 Grok;外部 AI 调用研报站的 /api/mcp 四个只读工具读取已有数据,回答里附原文链接跳回阅读页。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central}
.ts{font-size:12px;text-anchor:middle;dominant-baseline:central}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
.note{font-size:12px;fill:#5F5E5A}
</style>
</defs>
<rect width="680" height="460" fill="#FFFFFF"/>

<text class="note" x="340" y="24" text-anchor="middle">AI 回答附原文链接,点回阅读页对应章节</text>
<path d="M555 60 V36 H125 V58" fill="none" stroke="#73726C" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<g class="gray"><rect x="40" y="60" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="125" y="80">阅读页 · 问这篇报告</text><text class="ts" x="125" y="99">登录后才露出入口</text></g>
<line x1="210" y1="88" x2="253" y2="88" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="255" y="60" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="80">复制提问文案</text><text class="ts" x="340" y="99">标题 + id + 版本</text></g>
<line x1="425" y1="88" x2="468" y2="88" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="470" y="60" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="555" y="80">Claude / Codex / Grok</text><text class="ts" x="555" y="99">粘贴文案 + 你的问题</text></g>
<line x1="555" y1="116" x2="555" y2="158" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="470" y="160" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="555" y="180">/api/mcp</text><text class="ts" x="555" y="199">公开只读 · 无状态</text></g>

<path d="M555 216 V240" class="arr"/>
<path d="M110 240 H566" class="arr"/>
<line x1="110" y1="240" x2="110" y2="262" class="arr" marker-end="url(#arrow)"/>
<line x1="262" y1="240" x2="262" y2="262" class="arr" marker-end="url(#arrow)"/>
<line x1="414" y1="240" x2="414" y2="262" class="arr" marker-end="url(#arrow)"/>
<line x1="566" y1="240" x2="566" y2="262" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="40" y="264" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="110" y="284">list_reports</text><text class="ts" x="110" y="303">列出全部研报</text></g>
<g class="teal"><rect x="192" y="264" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="262" y="284">get_report_outline</text><text class="ts" x="262" y="303">目录 + 版本历史</text></g>
<g class="teal"><rect x="344" y="264" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="414" y="284">read_report</text><text class="ts" x="414" y="303">按章节读 · 分页</text></g>
<g class="teal"><rect x="496" y="264" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="566" y="284">get_signals</text><text class="ts" x="566" y="303">SuperTrend 状态</text></g>

<line x1="110" y1="320" x2="110" y2="358" class="arr" marker-end="url(#arrow)"/>
<line x1="262" y1="320" x2="262" y2="358" class="arr" marker-end="url(#arrow)"/>
<line x1="414" y1="320" x2="414" y2="358" class="arr" marker-end="url(#arrow)"/>
<line x1="566" y1="320" x2="566" y2="358" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="40" y="360" width="596" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="338" y="382">已有数据:SQLite(研报 / 版本 / 信号)+ 原文 markdown</text></g>

<rect x="160" y="430" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="note" x="178" y="440">新增前端</text>
<rect x="270" y="430" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="note" x="288" y="440">新增服务端</text>
<rect x="390" y="430" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="note" x="408" y="440">已有 / 外部</text>
</svg>

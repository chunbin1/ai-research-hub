<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 每页的 <title> / 摘要 / canonical 由 nginx SSI 按请求路径向后端取
         (/api/seo/head/...,见 nginx.conf)。后端不可用时退回下面这个固定标题;
         vite dev 不处理 SSI,这几行注释被原样忽略,block 里的标题照常生效。 -->
    <!--# block name="seo_fallback" --><title>研报站</title><!--# endblock -->
    <!--# include virtual="/api/seo/head$request_uri" stub="seo_fallback" -->
    <!-- 站点图标:design_handoff_homepage/favicon 定稿的一套(深蓝底 + 三根递增柱,
         最右一根用站内强调红,与顶栏当前项下划线同色)。SVG 给现代浏览器,PNG 兜底,
         maskable 与 192/512 走 manifest 供 Android 主屏使用。 -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1B3A5C" />
    <!-- 标题和数字都用系统宋体(Songti SC / 华文宋体 / 宋体),界面用系统无衬线
         (PingFang / 微软雅黑)。不再把 Georgia、Times、Noto Serif 排在宋体前面或后面:
         那些西文衬线会把标题里的英文和数字换成另一套基线和字重。
         也不再从 Google Fonts 拉字体:那条 CSS 是渲染阻塞的,后面还要下大约 1.6MB 的
         woff2,移动端慢速网络上会把首屏拖住数秒,字到了还会把列表挤下去(CLS)。 -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 打包产物文件名自带内容 hash,内容一变文件名就变 —— 可以永久缓存。
    # 不给这条的话刷新时每个 asset 都要先来一次 304 协商,页面白着等一个来回。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 反过来:文件名固定,缓存住了就升级不了版本,必须每次校验。
    # ssi on:index.html 里有一条 include,按原始请求路径向后端要 <head> 片段
    # (标题 / 摘要 / canonical),让爬虫不跑 JS 也能看到每篇研报是什么。
    # SPA 兜底和 / 都会内部跳到这里,$request_uri 仍是浏览器请求的那个路径。
    location = /index.html {
        ssi on;
        # 构造出来的怪路径(如编码过的 ../)会被 nginx 当 unsafe URI 拒掉,
        # 默认会往页面里印一行报错文字;静默掉,这种页面不需要 head
        ssi_silent_errors on;
        add_header Cache-Control "no-cache" always;
        # 安全头只挂在文档上(Lighthouse 看的是这一份响应)。
        # CSP:脚本只允许同源,外加 Cloudflare Web Analytics 的 beacon(边缘注入;不放行的话控制台会多一条 CSP 拒绝)。
        # style 允许 unsafe-inline,因为 antd 运行时往 <style> / style 属性里写规则。
        # 不启用 Trusted Types:antd 和 React 会写 HTML sink,默认放行等于没防护,收紧会把弹层打挂。
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://lh3.googleusercontent.com https://avatars.githubusercontent.com; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 没有 ARD catalog。不在这里拦住的话,下面的 SPA fallback 会回 index.html,
    # Lighthouse 把那段 HTML 当成坏掉的 /ai-catalog.json。
    location = /ai-catalog.json {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404 '{"error":"not_found"}';
    }
    location = /.well-known/ai-catalog.json {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404 '{"error":"not_found"}';
    }

    # robots.txt / sitemap.xml 里要写绝对地址,由后端按 APP_URL 生成
    location = /robots.txt {
        proxy_pass http://server:3001/api/seo/robots.txt;
    }
    location = /sitemap.xml {
        proxy_pass http://server:3001/api/seo/sitemap.xml;
    }

    # SPA fallback — 所有路由返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSI 取 head 片段走这里:不能落进下面关了缓冲的 /api(SSE 专用),
    # 子请求按普通缓冲代理最稳。
    location /api/seo/ {
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
    }

    # 代理 API 到 server 容器
    location /api {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SSE 关键:禁用缓冲 + 长超时(流式问答)
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

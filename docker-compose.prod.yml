services:
  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - ./packages/server/.env.prod
    environment:
      - CHROMA_URL=http://chroma:8000
      - PORT=3001
      - RAG_MAX_K=10
    depends_on:
      - chroma
    volumes:
      - server_data:/app/data

  client:
    build:
      context: ./packages/client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # 只绑回环:公网经 host nginx + Cloudflare,不直连 :8080。CLIENT_BIND=0.0.0.0 可暴露。
      - "${CLIENT_BIND:-127.0.0.1}:${CLIENT_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  chroma_data:
  server_data:

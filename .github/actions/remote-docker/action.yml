name: 连上远程 Docker
description: 配好 SSH 与 docker context,让后续步骤能操作生产机上的 daemon。

inputs:
  ssh-key:
    description: 部署用私钥(secrets.DEPLOY_SSH_KEY)
    required: true
  known-hosts:
    description: |
      生产机的 host key(secrets.DEPLOY_KNOWN_HOSTS)。
      本地用 `ssh-keyscan -p <SSH端口> <主机>` 生成后整段存成 secret。
      不用 StrictHostKeyChecking=no —— 那等于每次都盲信,中间人可冒充。
    required: true
  ssh-target:
    description: 形如 user@主机:SSH端口(secrets.DEPLOY_SSH_TARGET)
    required: true
  context-name:
    description: docker context 名字,与 deploy.sh 的默认值保持一致
    required: false
    default: ai-research-hub

runs:
  using: composite
  steps:
    - name: 写入私钥与 known_hosts
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
        # runner 是一次性的,这里放宽到 Host * 不会影响别的东西
        cat > ~/.ssh/config <<'EOF'
        Host *
          IdentityFile ~/.ssh/id_deploy
          IdentitiesOnly yes
          StrictHostKeyChecking yes
          ServerAliveInterval 30
        EOF
        chmod 600 ~/.ssh/config

    - name: 建 docker context
      shell: bash
      env:
        SSH_TARGET: ${{ inputs.ssh-target }}
        CONTEXT: ${{ inputs.context-name }}
      run: |
        docker context create "$CONTEXT" --docker "host=ssh://${SSH_TARGET}"
        # 连通性自检:失败在这里比失败在 compose 中间更好定位
        docker --context "$CONTEXT" version --format '远程 daemon: {{.Server.Version}}'
